<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Song wird geladen…</title>
  <meta name="robots" content="noindex">

  <script src="tracks.js"></script>
  
  <script>
  const tracks = window.TRACKS || {};

  const params = new URLSearchParams(window.location.search); 
  const nRaw = params.get("n");
  const n = nRaw ? nRaw.trim().replace(/^0+/, "") : null; // führende Nullen entfernen
  const id = n ? tracks[n] : null;

  if (!id) {
    document.body.innerHTML =
      "<h1>Song nicht gefunden</h1><p>Bitte Link prüfen (z. B. ?n=17).</p>";
  } else {
    // 1) Versuch: Spotify-App öffnen
    window.location.replace("spotify:track:" + id);

    // 2) Versuch: Browser-Tab schließen
    setTimeout(() => {
      window.close();
    }, 1200);
    
    // 3) Fallback nach kurzer Zeit (falls App-Link nicht funktioniert): Web-Link
    setTimeout(() => {
      window.location.replace("https://open.spotify.com/track/" + id);
    }, 1800);
  }
</script>
  
</head>
<body>
  <p>Song wird geladen…</p>
</body>
</html>
